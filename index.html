<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChronoKnight · 我的网页游乐场</title>
<meta name="description" content="ChronoKnight 的第一个 GitHub 仓库，收集一些好玩的网页：魔方模拟器、消消乐、Markdown 阅读器、全景预览等。">
<style>
  :root {
    --bg: #0b0d12;
    --surface: rgba(255, 255, 255, 0.04);
    --surface-hover: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.09);
    --text: #eef1f6;
    --muted: #98a2b3;
    --accent: #7c9cff;
    --accent-2: #b892ff;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景光晕 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 520px; height: 520px;
    top: -180px; left: -140px;
    background: radial-gradient(circle, #4a6bff, transparent 70%);
  }
  body::after {
    width: 460px; height: 460px;
    bottom: -160px; right: -120px;
    background: radial-gradient(circle, #9b4aff, transparent 70%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- 顶部 ---------- */
  header {
    padding: 88px 0 56px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.02em;
    backdrop-filter: blur(8px);
  }
  .badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.15);
  }

  h1 {
    margin: 22px 0 14px;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    background: linear-gradient(120deg, #ffffff 20%, #a8b8ff 60%, #d0a8ff 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    max-width: 560px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 1rem;
  }

  .actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--border);
    background: var(--surface);
    transition: background 0.25s, transform 0.25s, border-color 0.25s;
  }
  .btn:hover {
    background: var(--surface-hover);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #0a0c10;
    font-weight: 600;
  }
  .btn.primary:hover { box-shadow: 0 10px 30px rgba(124, 156, 255, 0.28); }
  .btn svg { width: 16px; height: 16px; flex: none; }

  /* ---------- 分区 ---------- */
  section { padding: 34px 0; }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
  }
  .section-head h2 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .section-head span {
    color: var(--muted);
    font-size: 13px;
  }
  .section-head::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* ---------- 卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    display: block;
    padding: 22px 20px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                border-color 0.3s, background 0.3s;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(400px circle at 50% 0%, rgba(124, 156, 255, 0.16), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(124, 156, 255, 0.45);
    background: var(--surface-hover);
  }
  .card:hover::after { opacity: 1; }

  .icon {
    display: grid;
    place-items: center;
    width: 40px; height: 40px;
    margin-bottom: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(124, 156, 255, 0.2), rgba(184, 146, 255, 0.2));
    border: 1px solid rgba(124, 156, 255, 0.25);
    color: #c3d0ff;
  }
  .icon svg { width: 20px; height: 20px; }

  .card h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card h3 .arrow {
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.25s, transform 0.25s;
    color: var(--accent);
  }
  .card:hover h3 .arrow { opacity: 1; transform: translateX(0); }

  .card p {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.55;
  }

  /* ---------- 页脚 ---------- */
  footer {
    padding: 64px 0 48px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .sub { margin-top: 6px; }

  @media (max-width: 520px) {
    header { padding: 60px 0 36px; }
    .wrap { padding: 0 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<div class="wrap">
  <header>

    <div class="actions" id="site-actions"></div>

      <a id="footer-source" target="_blank" rel="noopener">查看源码</a>
      · 由 GitHub Pages 托管
    </p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var data = JSON.parse(document.getElementById('site-data').textContent);
  var icons = data.icons || {};

  var esc = function (str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  };

  // 用 icons 表生成 svg；缺失时返回空，不影响渲染
  var svg = function (name, extraClass) {
    var path = icons[name];
    if (!path) return '';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"' +
      ' stroke-linecap="round" stroke-linejoin="round"' +
      (extraClass ? ' class="' + extraClass + '"' : '') + '>' + path + '</svg>';
  };

  // ---------- 顶部 ----------
  var site = data.site || {};
  document.title = (site.title ? site.title + ' · ' : '') + 'ChronoKnight';
  document.getElementById('badge-text').textContent = site.badge || '';
  document.getElementById('site-title').textContent = site.title || '';
  document.getElementById('site-desc').textContent = site.description || '';

  document.getElementById('site-actions').innerHTML = (site.actions || []).map(function (a) {
    var attrs = ' class="btn' + (a.primary ? ' primary' : '') + '" href="' + esc(a.href) + '"';
    if (a.external || /^https?:/i.test(a.href || '')) {
      attrs += ' target="_blank" rel="noopener"';
    }
    return '<a' + attrs + '>' + svg(a.icon) + esc(a.label) + '</a>';
  }).join('');

  // ---------- 分区与卡片 ----------
  document.getElementById('projects').innerHTML = (data.sections || []).map(function (section) {
    var cards = (section.items || []).map(function (item) {
      var itemAttrs = ' href="' + esc(item.href) + '"';
      if (/^https?:/i.test(item.href || '')) {
        itemAttrs += ' target="_blank" rel="noopener"';
      }
      return '<a class="card"' + itemAttrs + '>' +
        '<div class="icon">' + svg(item.icon) + '</div>' +
        '<h3>' + esc(item.name) + ' <span class="arrow">→</span></h3>' +
        '<p>' + esc(item.description) + '</p>' +
        '</a>';
    }).join('');

    return '<section>' +
      '<div class="section-head">' +
        '<h2>' + esc(section.title) + '</h2>' +
        '<span>' + esc(section.description || '') + '</span>' +
      '</div>' +
      '<div class="grid">' + cards + '</div>' +
      '</section>';
  }).join('');

  // ---------- 页脚 ----------
  var footer = site.footer || {};
  document.getElementById('year').textContent = new Date().getFullYear();
  document.getElementById('footer-name').textContent = footer.name || '';
  document.getElementById('footer-note').textContent = footer.note || '';
  if (footer.source) {
    document.getElementById('footer-source').href = footer.source;
  }
})();
</script>

</html>
